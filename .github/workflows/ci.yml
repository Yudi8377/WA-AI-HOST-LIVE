name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Static security migration checks
        run: npm run check:security-migration
      - name: Agent network security tests
        run: node scripts/check-agent-network.mjs
      - name: Production health function contract tests
        run: npm run check:health-function
      - name: Workspace safety and UX contract checks
        run: npm run check:workspace-safety
      - name: WhatsApp Cloud API adapter contract tests
        run: npm run check:whatsapp-adapter
      - name: WhatsApp consent migration security checks
        run: npm run check:whatsapp-migration
      - name: WhatsApp webhook runtime security contracts
        run: npm run check:whatsapp-runtime
      - name: Runtime environment preflight self-tests
        run: npm run check:runtime-preflight
      - name: Aptinusa proximity marketing catalog safety checks
        run: npm run check:aptinusa-proximity-catalog
      - name: Aptinusa Growth Engine catalog safety checks
        run: npm run check:aptinusa-growth-catalog
      - name: Aptinusa marketing policy tests
        run: npm run test:aptinusa-marketing-policy
      - name: Rental knowledge and response regression tests
        run: npm run check:rental-knowledge
      - name: Inbox triage category and priority regression tests
        run: npm run check:inbox-triage
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
